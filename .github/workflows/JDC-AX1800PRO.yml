name: JDC-AX1800PRO

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch to build from'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - main-nss
          - 25.12-nss
  schedule:
    - cron: '0 17 * * 1'

env:
  REPO_URL: https://github.com/LiBwrt/openwrt-6.x.git
  CONFIG_FILE: configs/jdc_ax1800pro.config
  DIY_SCRIPT: libwrt.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  TZ: Asia/Ho_Chi_Minh

concurrency:
  group: jdc-ax1800pro-${{ matrix.branch }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main-nss","25.12-nss"]') || (github.event.inputs.branch == 'all' && fromJSON('["main-nss","25.12-nss"]') || fromJSON(format('["{0}"]', github.event.inputs.branch))) }}

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 2048
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -yqq install dos2unix libfuse-dev
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Check Server Performance
      run: |
        echo "===== CPU ====="
        echo "Physical CPUs: $(grep 'physical id' /proc/cpuinfo | sort -u | wc -l)"
        echo "CPU Model: $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2)"
        echo "CPU Cores: $(nproc)"
        echo "===== Memory ====="
        free -h
        echo "===== Disk ====="
        df -hT

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone Source Code
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone --depth 1 -b ${{ matrix.branch }} $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="Author: %an<br/>Date: %cd<br/>Message: %s<br/>Hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV

    - name: Generate Variables
      run: |
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig > /dev/null 2>&1
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(grep CONFIG_TARGET_SUBTARGET .config | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "FIRMWARE_TAG=JDC-AX1800PRO-${{ matrix.branch }}" >> $GITHUB_ENV

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: true
        mixkey: ${{ env.SOURCE_REPO }}-${{ matrix.branch }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Cache DL Directory
      uses: actions/cache@v4
      with:
        path: ${{ env.OPENWRT_PATH }}/dl
        key: dl-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ matrix.branch }}-${{ hashFiles(env.CONFIG_FILE) }}
        restore-keys: |
          dl-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ matrix.branch }}-

    - name: Install Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        git clone --depth 1 https://github.com/sbwml/openwrt_pkgs.git package/new/custom
        mv package/new/custom/luci-app-netspeedtest package/new
        mv package/new/custom/speedtest-cli package/new
        rm -rf package/new/custom
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        [ -e files ] && cp -r files $OPENWRT_PATH/files
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        chmod +x $DIY_SCRIPT
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY_SCRIPT
        make defconfig > /dev/null 2>&1

    - name: Download DL Package
      run: |
        cd $OPENWRT_PATH
        make download -j16
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo "Compiling ${{ matrix.branch }} with $(nproc) threads..."
        make -j$(($(nproc) + 1)) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ matrix.branch }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \;)" >> $GITHUB_ENV
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages 2>/dev/null || true
        tar -zcf Packages.tar.gz packages 2>/dev/null || true
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Artifact
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ matrix.branch }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 📒 Firmware Information
          - Kernel 6.12 firmware with WiFi and wired NSS hardware offloading
          - 💻 Platform: JDCloud AX1800 Pro (IPQ60XX)
          - ⚽ Firmware source: ${{ env.REPO_URL }}
          - 💝 Source branch: ${{ matrix.branch }}
          - 🌐 Default address: 10.6.7.1
          - 🔑 Default password: password
          ### 🧊 Firmware Version
          - Kernel version: ${{ env.VERSION_KERNEL }}
          - Last source update before build:
          - ${{ env.VERSION_INFO }}
          ### ⚡ NSS Features
          - Full NSS hardware offloading (NAT, PPPoE, L2TP, PPTP, VXLAN, MAP-T, QoS)
          - IRQ balancing across CPU cores
          - TCP BBR congestion control
          - -O3 cortex-a53 optimised compilation

